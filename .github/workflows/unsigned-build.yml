# Build installable artifacts without code signing, for testing a branch before
# it is released. Deliberately separate from release.yml, which requires the
# Apple and Azure signing secrets that only the upstream repo holds.
#
# The resulting builds are UNSIGNED: macOS needs right-click > Open on first
# launch, and Windows shows a SmartScreen warning.
name: Unsigned build

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prebuild:mac
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run build:renderer
      - run: npx electron-builder --mac --arm64 --config electron-builder.unsigned-mac.json --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: openwhispr-macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prebuild:win
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run build:renderer
      - run: npx electron-builder --win --config electron-builder.unsigned-win.json --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: openwhispr-windows-x64
          path: |
            dist/*.exe
          if-no-files-found: error
